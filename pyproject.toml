[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mmm-case"
version = "0.1.0"
description = "Marketing-mix case study with Google Meridian: ROI, mROI, reallocation and budget optimization"
requires-python = ">=3.11"
# Direct dependencies; requirements.txt pins the full environment used for the published numbers.
dependencies = ["google-meridian[schema]==2.1.0", "matplotlib", "pandas", "numpy"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
